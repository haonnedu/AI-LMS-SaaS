name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m ruff check --config backend/pyproject.toml scripts
      - run: python -m ruff format --check --config backend/pyproject.toml scripts
      - run: python -m pytest -c backend/pyproject.toml scripts/tests -q

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
        env:
          POSTGRES_DB: eduvia
          POSTGRES_USER: eduvia
          POSTGRES_PASSWORD: eduvia_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduvia -d eduvia"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python scripts/export_openapi.py ../contracts/openapi.json
      - run: git diff --exit-code -- ../contracts/openapi.json
      - run: alembic upgrade head
      - name: Verify live infrastructure readiness
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- src/lib/api/generated.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:workspace
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose config --quiet
      - name: Validate isolated staging configuration
        run: |
          set -euo pipefail
          python3 deploy/generate-env.py "$RUNNER_TEMP/staging.env" --tunnel
          export RELEASE_SHA="$GITHUB_SHA"
          docker compose --env-file "$RUNNER_TEMP/staging.env" -f compose.staging.yaml config --format json | python3 deploy/validate-config.py
          bash -n deploy/deploy.sh deploy/postgres/10-bootstrap.sh
      - name: Verify production build, migrations and dependency recovery
        run: python scripts/verify-m0.py
      - name: Upload sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-verification
          if-no-files-found: warn
          path: |
            tmp/eduvia-m0-*/result.json
            tmp/eduvia-m0-*/commands.log

  auth-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
        env:
          POSTGRES_DB: eduvia_auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: auth_test_only
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d eduvia_auth_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6381:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      AUTH_TEST_DATABASE_URL: postgresql+psycopg://postgres:auth_test_only@127.0.0.1:5434/eduvia_auth_test
      AUTH_E2E_DATABASE_URL: postgresql+psycopg://eduvia_runtime:runtime_test_only@127.0.0.1:5434/eduvia_auth_test
      AUTH_E2E_REDIS_URL: redis://127.0.0.1:6381/2
      AUTH_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e backend
      - name: PostgreSQL identity, migrations, concurrency and RLS
        working-directory: backend
        run: python -m pytest tests/test_bootstrap.py tests/test_identity_integration.py tests/test_auth.py -q
      - name: PostgreSQL integration for classes, jobs, knowledge, retrieval, authoring, exams, assessment
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_classes_integration.py tests/test_jobs_integration.py
          tests/test_knowledge_integration.py tests/test_knowledge_retrieval_integration.py
          tests/test_authoring_integration.py tests/test_generation_integration.py
          tests/test_assessment_integration.py
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: OIDC browser and Redis session tests
        working-directory: frontend
        run: npm run test:auth

      - name: Better Auth email, Google linking and session regression
        working-directory: frontend
        run: npm run test:better-auth
