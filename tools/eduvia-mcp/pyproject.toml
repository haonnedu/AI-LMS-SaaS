[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "eduvia-mcp"
version = "0.1.0"
description = "Read-only local MCP tools for Eduvia source and Markdown backlog"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==2.3.0", "pydantic>=2.11,<3"]

[project.scripts]
eduvia-mcp = "eduvia_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/eduvia_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["eduvia_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A fresh checkout has no .pytest_cache parent when tmp_path first initializes.
addopts = "--basetemp=.pytest-tmp"
