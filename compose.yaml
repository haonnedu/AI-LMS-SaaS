# Local development only: loopback ports, disposable Redis, persistent PostgreSQL and MinIO.
# No identity or tenant data endpoints are enabled by the foundation scaffold.
name: eduvia

x-backend: &backend
  build:
    context: ./backend
  environment: &backend-environment
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg://eduvia_runtime:${DB_RUNTIME_PASSWORD:-runtime_dev_only}@db:5432/${POSTGRES_DB:-eduvia}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    AUTH_ISSUER: ${AUTH_ISSUER-}
    AUTH_AUDIENCE: ${AUTH_AUDIENCE-}
    AUTH_JWKS_URL: ${AUTH_JWKS_URL-}
    CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}","http://127.0.0.1:${FRONTEND_PORT:-3000}"]'
    # Private bucket on local MinIO. Signed download URLs embed S3_ENDPOINT_URL, so browsers
    # on the host need the loopback-published port, not the in-network hostname.
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-eduvia-dev}
    S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-eduvia_dev}
    S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-eduvia_dev_only}
    UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}

services:
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    profiles: [dev-mail]
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_LABEL: Eduvia local mail — not delivered externally
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduvia}
      POSTGRES_USER: ${POSTGRES_USER:-eduvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduvia_dev_only}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-migrator_dev_only}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:-auth_dev_only}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:-runtime_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/10-bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
      - ./deploy/postgres/bootstrap.sql:/opt/eduvia/bootstrap.sql:ro
      - ./deploy/postgres/20-auth-role.sh:/docker-entrypoint-initdb.d/20-auth-role.sh:ro
      - ./deploy/postgres/auth-role.sql:/opt/eduvia/auth-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eduvia_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eduvia_dev_only}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eduvia_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eduvia_dev_only}
      S3_BUCKET: ${S3_BUCKET:-eduvia-dev}
    # One private bucket; anonymous access stays disabled (signed URLs only).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *backend
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql+psycopg://eduvia_migrator:${DB_MIGRATOR_PASSWORD:-migrator_dev_only}@db:5432/${POSTGRES_DB:-eduvia}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--beat", "--loglevel=INFO", "--concurrency=2", "-Q", "default,ingestion,generation,export,omr"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET-}
      BETTER_AUTH_AUDIENCE: ${BETTER_AUTH_AUDIENCE:-https://eduvia-api}
      AUTH_DATABASE_URL: postgresql://eduvia_auth_runtime:${DB_AUTH_PASSWORD:-auth_dev_only}@db:5432/${POSTGRES_DB:-eduvia}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET-}
      SMTP_URL: ${SMTP_URL-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM-}
      API_INTERNAL_URL: http://api:8000
      APP_BASE_URL: ${APP_BASE_URL-}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY-}
      SESSION_REDIS_URL: redis://redis:6379/2
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:

